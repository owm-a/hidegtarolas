name: ArrivaBus hidegtárolás_2

on:
  schedule:
    - cron: "32 16 * * *"
      timezone: "Europe/Budapest"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hidegtarolas-main
  cancel-in-progress: false

jobs:
  teszt:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v5

      - name: Python beállítása
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Budapest dátum meghatározása
        id: datum
        run: |
          echo "datum=$(TZ=Europe/Budapest date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: GTFS cache betöltése
        uses: actions/cache@v4
        with:
          path: gtfs_cache
          key: gtfs-cache-${{ steps.datum.outputs.datum }}

      - name: Program futtatása
        env:
          BKK_API_KEY: ${{ secrets.BKK_API_KEY }}
        run: python main.py

      - name: Excel exportok ellenőrzése
        run: |
          python - <<'PY'
          import os
          import openpyxl

          fajlok = [
              "data/hidegtarolas_export.xlsx",
              "data/garazstarolas_export.xlsx",
          ]

          for fajl in fajlok:
              if not os.path.isfile(fajl) or os.path.getsize(fajl) == 0:
                  raise SystemExit(f"HIBA: az Excel export hiányzik vagy üres fájl: {fajl}")

              wb = openpyxl.load_workbook(fajl, read_only=True, data_only=True)
              if "Riport" not in wb.sheetnames:
                  raise SystemExit(f"HIBA: nincs Riport munkalap: {fajl}")

              ws = wb["Riport"]
              adatsorok = sum(
                  1 for row in ws.iter_rows(min_row=2, values_only=True)
                  if any(value is not None for value in row)
              )
              print(f"Ellenőrzés: {fajl}; adatsorok: {adatsorok}")

              if adatsorok == 0:
                  raise SystemExit(f"HIBA: a Riport munkalap nem tartalmaz adatsorokat: {fajl}")

              wb.close()
          PY

      - name: Napi adatok és mindkét Excel mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add napi_adatok.json index.html data/hidegtarolas_export.xlsx data/garazstarolas_export.xlsx

          if git diff --cached --quiet; then
            echo "Nincs új mentendő adat."
          else
            git commit -m "Napi adatok, HTML és hidegtárolási Excel-exportok frissítése"
            git push
          fi
