name: ArrivaBus hidegtárolás_2

# Az automatikus indítást a cron-job.org végzi workflow_dispatch hívással.
# A GitHub Actions saját schedule-je szándékosan nincs bekapcsolva.
on:
  workflow_dispatch:

# A bot commitjeit a GITHUB_TOKEN készíti, ezért azok önmagukban
# nem indítanak új workflow-t. A Pages telepítést ezért ez a workflow
# végzi el közvetlenül, a Python-program és a git push után.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hidegtarolas-main
  cancel-in-progress: false

jobs:
  teszt:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v5

      - name: Python beállítása
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Budapest dátum meghatározása
        id: datum
        run: |
          echo "datum=$(TZ=Europe/Budapest date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: GTFS cache betöltése
        uses: actions/cache@v4
        with:
          path: gtfs_cache
          key: gtfs-cache-${{ steps.datum.outputs.datum }}

      - name: Program futtatása
        env:
          BKK_API_KEY: ${{ secrets.BKK_API_KEY }}
        run: python main.py

      - name: Napi adatok, HTML, archívum és Excel-fájlok mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add napi_adatok.json index.html
          # Az -A a rotáció során törölt, 60 napnál régebbi fájlokat is commitolja.
          git add -A data/history/
          for fajl in data/hidegtarolas_export.xlsx data/garazstarolas_export.xlsx; do
            if [ -f "$fajl" ]; then git add "$fajl"; fi
          done

          if git diff --cached --quiet; then
            echo "Nincs új mentendő adat."
          else
            git commit -m "Napi adatok, HTML, archívum és hidegtárolási Excel-exportok frissítése"
            git push
          fi

      # A publikálás ugyanebben a workflow-ban történik, így biztosan
      # csak a Python-program által frissített fájlok után indul el.
      - name: GitHub Pages csomag elkészítése
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages telepítése
        id: deployment
        uses: actions/deploy-pages@v4
