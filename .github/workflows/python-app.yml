# This workflow will install Python dependencies
# and run the ArrivaBus Python application.

name: ArrivaBus hidegtárolás

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: "6,11,16,21,26,31,36,41,46,51,56 * * * *"
      timezone: "Europe/Budapest"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Budapest dátum meghatározása
      id: datum
      run: |
        echo "datum=$(TZ=Europe/Budapest date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: GTFS cache betöltése
      uses: actions/cache@v4
      with:
        path: gtfs_cache
        key: gtfs-cache-${{ steps.datum.outputs.datum }}

    - name: Program futtatása
      env:
        BKK_API_KEY: ${{ secrets.BKK_API_KEY }}
      run: |
        python main.py

    - name: Napi adatok mentése
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add napi_adatok.json index.html

        if git diff --cached --quiet; then
          echo "Nincs új mentendő adat."
        else
          git commit -m "Napi adatok és HTML export frissítése"
          git push
        fi
