<head>

<style>
:root{
    --bg:#11151b;--surface:#181e26;--surface2:#202733;--surface3:#252d39;
    --border:#313b49;--text:#e8edf3;--muted:#9ca8b7;--accent:#6ea8fe;
    --accent2:#4f8ff7;--ok:#16a765;--bad:#e05252;--dark:#2c333d;
    --shadow:0 10px 30px rgba(0,0,0,.20);--radius:12px;
    --left-width:auto;--storage-width:auto;
}
html{background:var(--bg);width:100%;max-width:100%;overflow-x:hidden}
html:has(body.light-mode){background:#eef2f6}
body{
    margin:0;padding:18px;width:100%;max-width:100%;min-height:100vh;box-sizing:border-box;
    overflow-x:hidden;background:radial-gradient(circle at 10% 0%,rgba(110,168,254,.07),transparent 28%),var(--bg);
    color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.fejlec,.tabla-szekcio{
    background:rgba(24,30,38,.96);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);box-sizing:border-box;
}
.fejlec{padding:16px 18px;margin-bottom:14px}
.fejlec-top{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin-bottom:9px}
.fejlec-cim-archivum{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.cim{color:#f3f6fa;font-size:23px;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:7px}.cim-busz-svg{display:inline-block;width:25px;height:25px;flex:0 0 25px;vertical-align:middle}#oldal-cim{cursor:pointer}
.fejlec-adatok{display:flex;align-items:flex-start;justify-content:space-between;width:100%;gap:20px;margin-top:10px}
.fejlec-bal,.fejlec-jobb{display:flex;align-items:flex-start;gap:8px 20px;white-space:nowrap}
.fejlec-bal{flex-direction:row;flex-wrap:wrap}
.fejlec-jobb{margin-left:auto;justify-content:flex-end;flex-wrap:wrap}
.adat{font-size:12px;color:var(--muted);white-space:nowrap}.adat b{color:var(--text);font-weight:600}
.theme-toggle{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.16s}
.theme-toggle:hover{background:var(--surface3);border-color:var(--accent)}
.theme-switch-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;min-width:62px;padding:4px 8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;cursor:pointer;transition:.16s}
.theme-switch-toggle:hover{border-color:var(--accent);background:var(--surface3)}
.theme-switch-toggle .theme-icon{font-size:17px;line-height:1;display:inline-block;min-width:18px;text-align:center}
.theme-switch{width:25px;height:14px;border-radius:99px;background:#687384;display:inline-flex;align-items:center;padding:2px;box-sizing:border-box;transition:background .16s}
.theme-switch span{height:10px;width:10px;border-radius:50%;background:#fff;transition:transform .16s}
.theme-switch-toggle[aria-pressed="true"] .theme-switch{background:var(--ok)}
.theme-switch-toggle[aria-pressed="true"] .theme-icon{color:var(--ok)}
.theme-switch-toggle[aria-pressed="true"] .theme-switch span{transform:translateX(11px)}
.fejlec-vezerlok{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.fejlec-archivum{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;margin-top:0}
.history-calendar{width:76px;flex:0 0 76px;box-sizing:border-box}
.history-calendar-button{width:100%;box-sizing:border-box;justify-content:center}
.fejlec-archivum #history-load-status{margin-left:4px}
.auto-refresh-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:58px;height:34px;padding:4px 7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;cursor:pointer;transition:.16s}
.auto-refresh-toggle:hover{border-color:var(--accent);background:var(--surface3)}
.auto-refresh-toggle .refresh-icon{font-size:19px;line-height:1;font-weight:700;display:inline-block;transition:transform .25s}
.auto-refresh-toggle[aria-pressed="true"] .refresh-icon{color:var(--ok)}
.auto-refresh-toggle[aria-pressed="false"] .refresh-icon{color:var(--muted)}
.auto-switch{width:25px;height:14px;border-radius:99px;background:#687384;display:inline-flex;align-items:center;padding:2px;box-sizing:border-box;transition:background .16s}
.auto-switch span{height:10px;width:10px;border-radius:50%;background:#fff;transition:transform .16s}
.auto-refresh-toggle[aria-pressed="true"] .auto-switch{background:var(--ok)}
.auto-refresh-toggle[aria-pressed="true"] .auto-switch span{transform:translateX(11px)}
.torteneti-vezerlo{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:5px 7px;font:inherit;font-size:12px;width:max-content;max-width:100%;box-sizing:border-box}
.history-calendar-button{display:inline-flex;align-items:center;gap:5px;min-width:0;width:auto;justify-content:flex-start;white-space:nowrap;border:0;background:transparent;color:var(--text);font:inherit;font-size:12px;cursor:pointer;padding:2px 1px}
.history-calendar-button .calendar-mark{font-size:15px}
.history-calendar-popup{position:absolute;top:calc(100% + 7px);left:0;z-index:10000;width:258px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.history-calendar-popup[hidden]{display:none!important}
.history-calendar-month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.history-calendar-month button{width:28px;height:27px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);cursor:pointer}
.history-calendar-month strong{font-size:13px}
.history-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.history-calendar-weekday,.history-calendar-day{display:flex;align-items:center;justify-content:center;min-width:0;height:29px;font-size:11px}
.history-calendar-weekday{color:var(--muted);font-weight:700}
.history-calendar-day{border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted)}
.history-calendar-day.available{border-color:var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.history-calendar-day.available:hover{border-color:var(--accent);background:var(--surface3)}
.history-calendar-day.selected{background:var(--accent2);border-color:var(--accent2);color:white;font-weight:700}
.history-calendar-day:disabled{opacity:.42;cursor:default}
.adatforras{width:100%;box-sizing:border-box;margin:8px 0 0;text-align:right;font-size:10px;font-style:italic;color:var(--muted);opacity:.85}
.torteneti-vezerlo select{max-width:150px;min-width:125px;border:1px solid var(--border);border-radius:5px;padding:5px;background:var(--surface);color:var(--text);font:inherit}
#clear-click-locations{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap}
#clear-click-locations:hover{background:var(--surface3);border-color:var(--accent)}
#history-load-status{font-size:11px;color:var(--muted);max-width:210px}
#geozona-terkep{width:100%;height:50vh;max-height:50vh;min-height:320px;margin:0 0 14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.nezet-valaszto{display:flex;align-items:center;gap:6px;margin:0;padding:4px;width:fit-content;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.16)}
.fejlec-archivum{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nezet-gomb[data-nezet="biztor"]{background:#2878d0;color:#fff}
.nezet-gomb[data-nezet="garazs"]{background:#198754;color:#fff}
.nezet-gomb[data-nezet="biztor"].active{background:#2878d0!important;color:#fff!important;box-shadow:0 3px 10px rgba(40,120,208,.28)}
.nezet-gomb[data-nezet="garazs"].active{background:#198754!important;color:#fff!important;box-shadow:0 3px 10px rgba(25,135,84,.28)}
/* Csak az aktív nézet kap kék/zöld hátteret; az inaktív gomb beleolvad az alapháttérbe. */
.nezet-gomb[data-nezet="biztor"],
.nezet-gomb[data-nezet="biztor"]:hover,
.nezet-gomb[data-nezet="biztor"]:focus-visible,
.nezet-gomb[data-nezet="garazs"],
.nezet-gomb[data-nezet="garazs"]:hover,
.nezet-gomb[data-nezet="garazs"]:focus-visible{background:transparent!important;box-shadow:none!important}
.nezet-gomb[data-nezet="biztor"]:not(.active),
.nezet-gomb[data-nezet="biztor"]:not(.active):hover,
.nezet-gomb[data-nezet="biztor"]:not(.active):focus-visible{color:#2878d0!important}
.nezet-gomb[data-nezet="garazs"]:not(.active),
.nezet-gomb[data-nezet="garazs"]:not(.active):hover,
.nezet-gomb[data-nezet="garazs"]:not(.active):focus-visible{color:#198754!important}
.nezet-gomb[data-nezet="biztor"].active,
.nezet-gomb[data-nezet="biztor"].active:hover,
.nezet-gomb[data-nezet="biztor"].active:focus-visible{background:#2878d0!important;color:#fff!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 3px 10px rgba(0,0,0,.18)!important}
.nezet-gomb[data-nezet="garazs"].active,
.nezet-gomb[data-nezet="garazs"].active:hover,
.nezet-gomb[data-nezet="garazs"].active:focus-visible{background:#198754!important;color:#fff!important;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 3px 10px rgba(0,0,0,.18)!important}
.nezet-gomb[data-nezet="biztor"] .online-szam,
.nezet-gomb[data-nezet="garazs"] .online-szam{display:inline-block;color:var(--text)!important;background:var(--surface2)!important;border:1px solid var(--border);opacity:1!important;font-weight:800!important;font-size:11px!important;line-height:1.4;padding:1px 5px;border-radius:5px;text-shadow:none!important}
.nezet-gomb[data-nezet="biztor"].active .online-szam,
.nezet-gomb[data-nezet="garazs"].active .online-szam{color:#fff!important;background:rgba(0,0,0,.22)!important;border-color:transparent!important}
.ertekelt-fordak{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;vertical-align:middle}
.ertekelt-fordak .ertek-v,.ertekelt-fordak .ertek-g{display:inline-block;padding:1px 5px;border-radius:4px;color:#fff;font-weight:700}
.ertekelt-fordak .ertek-v{background:#2878d0}
.ertekelt-fordak .ertek-g{background:#198754}
.ertekelt-fordak .ertek-szumma{display:inline-block;padding:2px 6px;border:1px solid #111827;border-radius:4px;background:#111827;color:#fff;font-weight:800;line-height:1.25}
body.light-mode .ertekelt-fordak .ertek-szumma{background:#111827;color:#fff;border-color:#111827}
body:not(.light-mode) .ertekelt-fordak .ertek-szumma{background:#f9fafb;color:#111827;border-color:#f9fafb}
.nezet-fejlec-sor{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.nezet-fejlec-sor .nezet-valaszto{margin:0}
.kijelolt-adat{min-height:20px;display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px;font-weight:700}
.kijelolt-adat:empty{display:none}
.kijelolt-adat .kijelolt-ertek{color:#2583ff;border-top:2px solid #2583ff;border-bottom:2px solid #2583ff;padding:2px 6px;border-radius:2px}
.fo-kozos-tabla td.rendszam.kijelolt-rendszam{border-top:2px solid #2583ff!important;border-bottom:2px solid #2583ff!important;box-shadow:inset 0 1px 0 #2583ff,inset 0 -1px 0 #2583ff}
@media(max-width:600px){.nezet-fejlec-sor{align-items:stretch;gap:6px;margin-bottom:10px}.kijelolt-adat{padding:2px 6px;font-size:12px;min-height:22px}.nezet-fejlec-sor .nezet-valaszto{margin:0}}
.nezet-gomb{border:0;border-radius:7px;padding:8px 13px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:.16s}
.nezet-gomb:hover{color:var(--text);background:var(--surface3)}
.nezet-gomb.active{color:white;background:linear-gradient(135deg,var(--accent2),#6b7ff0);box-shadow:0 4px 12px rgba(79,143,247,.24)}
.nezet-gomb:active{transform:translateY(1px)}
.online-szam{display:inline-block;margin-left:5px;font-size:11px;font-weight:600;color:var(--muted);opacity:.9}.nezet-gomb.active .online-szam{color:rgba(255,255,255,.82)}
.nezet-panel{display:block}.nezet-panel.hidden{display:none!important}
.tabla-szekcio{width:100%;max-width:100%;margin:0;padding:12px;border-top:1px solid var(--border);overflow:hidden;position:relative}
.mobil-scroll-nyil{display:none}
@media(max-width:600px){.mobil-scroll-nyil{position:absolute;right:8px;top:12px;bottom:12px;z-index:80;width:42px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:7px 0;box-sizing:border-box;border-radius:0 8px 8px 0;background:linear-gradient(90deg,rgba(59,130,246,.06),rgba(59,130,246,.22) 45%,rgba(37,99,235,.36));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#1677e8;font-size:25px;font-weight:800;line-height:1;pointer-events:auto;cursor:pointer;touch-action:manipulation;text-shadow:0 0 7px rgba(59,130,246,.35);opacity:0;transition:opacity .18s}.mobil-scroll-nyil span{display:block;flex:0 0 auto}.tabla-szekcio.van-jobbra .mobil-scroll-nyil{opacity:1}body.light-mode .mobil-scroll-nyil{background:linear-gradient(90deg,rgba(147,197,253,.08),rgba(96,165,250,.24) 45%,rgba(59,130,246,.35))}}
.idopont-csuszkasav{
    width:90%;height:38px;margin:0 auto;display:flex;align-items:center;justify-content:center;
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    box-sizing:border-box;overflow:hidden;padding:0 12px;
}
.csuszka-info{color:var(--muted);font-size:12px;font-weight:650;white-space:nowrap;padding-left:8px}
.csuszka-info strong{color:var(--text)}
.idopont-csuszkasav input[type=range]{flex:1 1 auto;width:100%;min-width:0;margin:0;accent-color:var(--accent);cursor:pointer}
.tabla-egesz{display:grid;grid-template-columns:var(--left-width) minmax(0,1fr) var(--storage-width);width:100%;max-width:100%;min-width:0;overflow:hidden;background:var(--surface)}
.fix-ablak{min-width:0;overflow:hidden;background:var(--surface)}
.ido-ablak{min-width:0;overflow:hidden;background:var(--surface);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.ido-belso{width:max-content;min-width:100%;overflow:visible}
.storage-ablak{min-width:0;overflow:hidden;background:var(--surface)}
table{border-collapse:collapse;background:var(--surface);color:var(--text);font-size:12px;table-layout:auto}
th,td{border:1px solid var(--border);padding:0 5px;text-align:center;height:24px;line-height:22px;box-sizing:border-box;white-space:nowrap}
th{background:var(--surface3);font-weight:600;color:#cbd5e1}
.fix-tabla,.storage-tabla{width:max-content;min-width:0}
.fix-tabla th.hely,.fix-tabla td.hely{text-align:left;width:max-content;min-width:0;max-width:none}
.fix-tabla th.rendszam,.fix-tabla td.rendszam{text-align:right}
.fix-tabla td.rendszam{font-weight:bold}
.fix-tabla th.viszonylat,.fix-tabla td.viszonylat,
.fix-tabla th.forda,.fix-tabla td.forda,
.fix-tabla th.rendszam,.fix-tabla td.rendszam{width:1%;white-space:nowrap}
.fix-tabla th.viszonylat,.fix-tabla th.forda,.fix-tabla th.rendszam{padding-left:5px;padding-right:5px}
.fix-tabla th.viszonylat .rendez-gomb,.fix-tabla th.forda .rendez-gomb,.fix-tabla th.rendszam .rendez-gomb{margin-left:4px}
/* A kezdés/végzés oszlop szélességét is a tartalom, elsősorban a fejléc határozza meg. */
.fix-tabla th.kezdés,.fix-tabla td.kezdés,
.fix-tabla th.végzés,.fix-tabla td.végzés{width:1%;white-space:nowrap;min-width:0}
.ido-tabla{width:max-content;min-width:100%}.ido-tabla th,.ido-tabla td{width:42px;min-width:42px;max-width:42px;padding:1px;text-align:left}
.fix-tabla tbody tr,.ido-tabla tbody tr,.storage-tabla tbody tr{height:24px;min-height:24px;max-height:24px}
.fix-tabla tbody td,.ido-tabla tbody td,.storage-tabla tbody td{height:24px;min-height:24px;max-height:24px;line-height:22px;padding-top:0;padding-bottom:0;box-sizing:border-box;overflow:hidden;vertical-align:middle}
/* A három különálló táblázat fejléc- és adatsorai azonos magasságúak,
   így a bal oldali 6 oszlop, az időoszlopok és a Valós tárolás mindig
   ugyanazon vízszintes sorvonalakra essen. */
.fix-tabla thead tr,.ido-tabla thead tr,.storage-tabla thead tr{height:31px;min-height:31px;max-height:31px}
.fix-tabla thead th,.ido-tabla thead th,.storage-tabla thead th{height:31px;min-height:31px;max-height:31px;box-sizing:border-box}
/* Nézetváltás: csak egy konténerosztály változik, a sorokat nem mérjük/írjuk át egyenként. */
#fo-tabla.view-biztor .fix-tabla tbody tr[data-forras="garazs"],
#fo-tabla.view-biztor .ido-tabla tbody tr[data-forras="garazs"],
#fo-tabla.view-biztor .storage-tabla tbody tr[data-forras="garazs"],
#fo-tabla.view-garazs .fix-tabla tbody tr[data-forras="biztor"],
#fo-tabla.view-garazs .ido-tabla tbody tr[data-forras="biztor"],
#fo-tabla.view-garazs .storage-tabla tbody tr[data-forras="biztor"]{display:none}
#fo-tabla.view-none .fix-tabla tbody tr[data-forras],#fo-tabla.view-none .ido-tabla tbody tr[data-forras],#fo-tabla.view-none .storage-tabla tbody tr[data-forras]{display:none}
#fo-tabla tbody tr[data-filter-match="0"]{display:none}

/* Mobilon a teljes nagy táblázat vízszintesen görgethető legyen. */
@media (max-width:900px){
    /* Mobil: valódi Excel-szerű vízszintes táblázat.
       A táblázat egyetlen scrollfelület, így ujjal közvetlenül
       az időoszlopokon lehet jobbra-balra húzni. */
    .tabla-szekcio{
        overflow:visible;
        width:100%;
        max-width:100%;
    }
    .tabla-egesz{
        display:block;
        width:100%;
        max-width:100%;
        min-width:0;
        overflow-x:auto;
        overflow-y:hidden;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;
        touch-action:pan-x pan-y;
    }
    .fo-kozos-tabla{
        width:max-content!important;
        min-width:max-content!important;
        max-width:none!important;
    }
    .idopont-csuszkasav{width:90%;min-width:0;}
}


@media (max-width:900px){
    .fo-kozos-tabla th,.fo-kozos-tabla td{
        white-space:nowrap;
    }
    .fo-kozos-tabla .sticky-bal{
        position:sticky!important;
    }
    .fo-kozos-tabla .sticky-jobb{
        position:sticky!important;
        right:0;
    }
}
.ido-tabla .fo-kozos-tabla{border-collapse:collapse;background:var(--surface);color:var(--text);font-size:12px;table-layout:auto;width:max-content;min-width:100%;}
 .fo-kozos-tabla .col-idopont{width:42px;min-width:42px;max-width:42px}
 .fo-kozos-tabla th,.fo-kozos-tabla td{border:1px solid var(--border);padding:0 5px;text-align:center;height:24px;line-height:22px;box-sizing:border-box;white-space:nowrap}
 .fo-kozos-tabla th{background:var(--surface3);font-weight:600;color:#cbd5e1}
 .fo-kozos-tabla tbody tr{height:24px}.fo-kozos-tabla thead tr{height:31px}.fo-kozos-tabla thead th{height:31px}
 .fo-kozos-tabla .sticky-bal,.fo-kozos-tabla .sticky-jobb{position:sticky;background:var(--surface);z-index:30}
 .fo-kozos-tabla thead .sticky-bal,.fo-kozos-tabla thead .sticky-jobb{background:var(--surface3);z-index:50}

  </div>
  <div class="tabla-egesz" id="fo-tabla">
    <table class="fo-kozos-tabla">
      <thead>
        <tr class="fejlec-sor">
          <th class="viszonylat sticky-bal bal-1">Viszonylat <button class="rendez-gomb" type="button" data-sort-col="0">↕</button></th>
          <th class="forda sticky-bal bal-2">Forda <button class="rendez-gomb" type="button" data-sort-col="1">↕</button></th>
          <th class="kezdés sticky-bal bal-3">Kezdés <button class="rendez-gomb" type="button" data-sort-col="2" data-sort-type="time">↕</button></th>
          <th class="végzés sticky-bal bal-4">Végzés <button class="rendez-gomb" type="button" data-sort-col="3" data-sort-type="time">↕</button></th>
          <th class="hely sticky-bal bal-5">Hely <button class="rendez-gomb" type="button" data-sort-col="4">↕</button></th>
          <th class="rendszam sticky-bal bal-6">Rendszám <button class="rendez-gomb" type="button" data-sort-col="5">↕</button></th>
<th class="sticky-jobb storage">Valós tárolás <button class="rendez-gomb" type="button" data-sort-col="storage">↕</button></th></tr><tr class="szuro-sor"><th class="sticky-bal bal-1"><input class="oszlop-kereso" data-col="0" placeholder="Keresés…" aria-label="Viszonylat keresése"></th><th class="sticky-bal bal-2"><input class="oszlop-kereso" data-col="1" placeholder="Keresés…" aria-label="Forda keresése"></th><th class="sticky-bal bal-3"></th><th class="sticky-bal bal-4"></th><th class="sticky-bal bal-5"><input class="oszlop-kereso" data-col="4" placeholder="Keresés…" aria-label="Hely keresése"></th><th class="rendszam sticky-bal bal-6"><input class="oszlop-kereso" data-col="5" placeholder="Keresés…" aria-label="Rendszám keresése"></th><th class="sticky-jobb storage"><input class="oszlop-kereso" data-col="storage" placeholder="Keresés…" aria-label="Valós tárolás keresése"></th></tr></thead><tbody id="fix-tbody-common"></tbody></table></div><div class="mobil-scroll-nyil" aria-hidden="true"><span>›</span></div></div></div>
<script>
(function(){
  const fo=document.getElementById('fo-tabla');
  const slider=document.getElementById('fo-idopont-csuszka');
  const sliderBar=document.getElementById('fo-csuszkasav');
  const table=fo?.querySelector('.fo-kozos-tabla');
  const tbody=table?.querySelector('tbody');
  const buttons=document.querySelectorAll('.nezet-gomb');
  if(!fo||!slider||!table||!tbody)return;
  const NEZET_STORAGE_KEY='hidegtarolas-aktiv-nezet';
  const ERVENYES_NEZETEK=['mindketto','biztor','garazs','none'];
  // Minden teljes oldalbetöltéskor a Végállomás legyen az alapnézet.
  // A felhasználó menet közbeni választását továbbra is elmentjük, de F5/újranyitás
  // után ismét a Végállomás nézet indul.
  function betoltottNezet(){ return 'biztor'; }
  let currentView=betoltottNezet(),sortState={col:null,dir:1};


  function mobilTablaSorrend(){
    const mobil=window.matchMedia('(max-width:600px)').matches;
    const sorok=Array.from(table.querySelectorAll('tr'));
    sorok.forEach(tr=>{
      const storage=tr.querySelector('.storage');
      if(!storage)return;
      if(mobil){
        const rendszam=tr.querySelector('.rendszam');
        if(rendszam && storage.nextElementSibling!==rendszam){
          tr.insertBefore(storage,rendszam);
        }
      }else{
        if(storage.parentElement && storage !== tr.lastElementChild){
          tr.appendChild(storage);
        }
      }
    });
  }
  mobilTablaSorrend();
  const rowList=Array.from(tbody.children);
  const filterInputs=Array.from(document.querySelectorAll('.oszlop-kereso[data-col]'));
  // Mobilon a kereső fókusza ne okozzon automatikus lapugrást.
  filterInputs.forEach(inp=>{
    inp.addEventListener('touchstart',()=>{
      if(window.innerWidth<=900){
        inp.dataset.savedScrollY=String(window.scrollY);
      }
    },{passive:true});

    inp.addEventListener('focus',()=>{
      if(window.innerWidth<=900){
        const savedY=Number(inp.dataset.savedScrollY||window.scrollY);
        const restore=()=>{
          window.scrollTo(window.scrollX,savedY);
        };
        restore();
        requestAnimationFrame(restore);
        setTimeout(restore,50);
        setTimeout(restore,150);
        setTimeout(restore,300);
      }
    });
  });

  // Mobil kereső fókusz: a böngésző ne ugorjon a lap tetejére
  // a billentyűzet megnyitásakor.
  let mobilKeresesiScrollY=null;
  filterInputs.forEach(inp=>{

    inp.addEventListener('focus',()=>{
      if(window.matchMedia('(max-width:900px)').matches){
        mobilKeresesiScrollY=window.scrollY;
        const visszaallit=()=>{
          if(mobilKeresesiScrollY!==null){
            window.scrollTo(window.scrollX,mobilKeresesiScrollY);
          }
        };
        setTimeout(visszaallit,0);
        setTimeout(visszaallit,100);
        setTimeout(visszaallit,300);
      }
    });
  });
  const sortButtons=Array.from(document.querySelectorAll('.rendez-gomb'));
  function rows(){return rowList;}

  // A táblázat természetes szélességét a böngésző számolja ki.
  // Nem írjuk végig minden sor celláinak width/left értékeit, mert ez
  // több ezer DOM-műveletet és felesleges újratördelést okozott.
  function sticky(){
    const head=table.querySelector('thead tr:first-child');
    if(!head)return;
    const heads=head.children;
    let left=0;
    for(let i=0;i<6;i++){
      const w=heads[i]?.getBoundingClientRect().width||0;
      const px=left.toFixed(3)+'px';
      document.documentElement.style.setProperty('--bal-'+(i+1),px);
      left+=w;
    }
  }
  function frissitMobilNyilat(){
    const szekcio=fo.closest(".tabla-szekcio");
    if(!szekcio)return;
    const mobil=window.matchMedia("(max-width:600px)").matches;
    const max=Math.max(0,fo.scrollWidth-fo.clientWidth);
    const nyilDoboz=szekcio.querySelector(".mobil-scroll-nyil");
    // Mobilon legalább egy nyíl jelezze a vízszintes görgetést, üres táblánál is.
    // A nyilak száma a táblázat magasságából következik; hosszú táblánál
    // egyenletesen elosztva több nyíl jelzi a görgetést.
    // A nyíldoboz a táblázat magasságához igazodik, így nem lóghat alá.
    if(nyilDoboz){
      const tablaRect=fo.getBoundingClientRect();
      const szekcioRect=szekcio.getBoundingClientRect();
      const tablaMagassag=Math.max(1,fo.offsetHeight);
      const nyilDb=Math.max(1,Math.ceil(tablaMagassag/200));
      if(nyilDoboz.childElementCount!==nyilDb){
        nyilDoboz.replaceChildren();
        for(let i=0;i<nyilDb;i++){
          const span=document.createElement("span");
          span.textContent="›";
          nyilDoboz.appendChild(span);
        }
      }
      nyilDoboz.style.top=(tablaRect.top-szekcioRect.top+szekcio.scrollTop)+"px";
      nyilDoboz.style.height=tablaMagassag+"px";
      nyilDoboz.style.bottom="auto";
    }
    szekcio.classList.toggle("van-jobbra",mobil && max>4 && fo.scrollLeft < max-4);
  }
  function layoutScroll(){
    const max=Math.max(0,fo.scrollWidth-fo.clientWidth);
    frissitMobilNyilat();
    slider.max=String(max);
    if (fo.scrollLeft > max) fo.scrollLeft=max;
  }
  // Mobilon a jobb oldali nyílra koppintva ugorjunk az idővonal legvégére.
  const mobilNyilDobozok=document.querySelectorAll('.mobil-scroll-nyil');
  mobilNyilDobozok.forEach(nyil=>{
    nyil.addEventListener('click',()=>{
      if(!window.matchMedia('(max-width:600px)').matches)return;
      const max=Math.max(0,fo.scrollWidth-fo.clientWidth);
      fo.scrollTo({left:max,behavior:'smooth'});
    });
  });
  function layout(){
    sticky();
    const max=Math.max(0,fo.scrollWidth-fo.clientWidth);
    slider.max=String(max);
    const mobil=window.matchMedia('(max-width:600px)').matches;
    if(mobil){
      /* Mobilon az időoszlopok jobb széle ne kényszerítse a táblát
         minden újratördeléskor a jobb oldalra. */
      slider.value=String(Math.min(fo.scrollLeft,max));
      if(fo.scrollLeft>max) fo.scrollLeft=max;
    }else{
      slider.value=String(max);
      fo.scrollLeft=max;
    }
  }
  function view(v,mentes=true){
    if(!ERVENYES_NEZETEK.includes(v)) v='mindketto';
    currentView=v;
    if(mentes){
      try{localStorage.setItem(NEZET_STORAGE_KEY,v);}catch(e){}
    }
    buttons.forEach(b=>b.classList.toggle('active', v==='mindketto' || b.dataset.nezet===v));
    fo.classList.remove('view-biztor','view-garazs','view-mindketto','view-none');
    fo.classList.add('view-'+v);fo.classList.toggle('all-view',v==='mindketto');
    requestAnimationFrame(()=>{sticky();layoutScroll();});
  }
  function applyFilters(){
    const mobilKereses=(window.matchMedia('(max-width:900px)').matches);
    const oldWindowScrollY=window.scrollY;
    rowList.forEach(r=>{
      let ok=true;
      for(const i of filterInputs){
        const q=i.value.trim().toLocaleLowerCase('hu-HU');
        if(!q) continue;
        const c=i.dataset.col==='storage'?r.querySelector('.sticky-jobb'):r.children[+i.dataset.col];
        if(!(c?.textContent||'').toLocaleLowerCase('hu-HU').includes(q)){ok=false;break;}
      }
      r.dataset.filterMatch=ok?'1':'0';
    });
    requestAnimationFrame(()=>{
      sticky();
      layoutScroll();
      if(mobilKereses){
        window.scrollTo(window.scrollX,oldWindowScrollY);
        requestAnimationFrame(()=>{
          if(Math.abs(window.scrollY-oldWindowScrollY)>1){
            window.scrollTo(window.scrollX,oldWindowScrollY);
          }
        });
      }
    });
  }
  function filters(){
    applyFilters();
  }
  function val(r,c){const x=c==='storage'?r.querySelector('.sticky-jobb'):r.children[+c];return x?.textContent.trim()||'';}
  function cmp(a,b,t){
    if(t==='time'){
      const ma=/^(\d{1,2}):(\d{2})$/.exec(a),mb=/^(\d{1,2}):(\d{2})$/.exec(b);
      if(ma&&mb)return(+ma[1]*60+ +ma[2])-(+mb[1]*60+ +mb[2]);
    }
    return a.localeCompare(b,'hu',{numeric:true,sensitivity:'base'});
  }
  function sort(btn){
    const c=btn.dataset.sortCol,t=btn.dataset.sortType||'';
    if(sortState.col===c)sortState.dir*=-1;else{sortState.col=c;sortState.dir=1;}
    sortButtons.forEach(b=>{b.classList.remove('active');b.textContent='↕'});
    btn.classList.add('active');btn.textContent=sortState.dir===1?'↑':'↓';
    const frag=document.createDocumentFragment();
    rowList.sort((a,b)=>cmp(val(a,c),val(b,c),t)*sortState.dir).forEach(r=>frag.appendChild(r));
    tbody.appendChild(frag);
    requestAnimationFrame(()=>{sticky();layoutScroll();});
  }
  let scrollFrame=0;
  slider.addEventListener('input',()=>{
    fo.scrollLeft=Math.min(fo.scrollWidth-fo.clientWidth,Math.max(0,+slider.value||0));
  });
  fo.addEventListener('scroll',()=>{
    if(scrollFrame)return;
    scrollFrame=requestAnimationFrame(()=>{
      slider.value=String(Math.round(fo.scrollLeft));
      frissitMobilNyilat();
      scrollFrame=0;
    });
  },{passive:true});
  buttons.forEach(b=>b.addEventListener('click',()=>{
    const clicked=b.dataset.nezet;
    let next;
    if(currentView==='none') next=clicked;
    else if(currentView==='mindketto') next=clicked==='biztor'?'garazs':'biztor';
    else if(currentView===clicked) next='none';
    else next='mindketto';
    view(next,true);
  }));
  sortButtons.forEach(b=>b.addEventListener('click',()=>sort(b)));
  filterInputs.forEach(i=>i.addEventListener('input',filters));
  window.addEventListener('resize',()=>requestAnimationFrame(()=>{mobilTablaSorrend();layout();}));
  rowList.forEach(r=>r.dataset.filterMatch='1');
  // Új megnyitáskor és F5 után mindig a Végállomás nézet indul.
  // A nézetet elmentjük, hogy a térkép jelölői is ehhez igazodjanak.
  view(currentView,true);
  layout();
})();
(function(){
  const btn=document.getElementById('theme-toggle');
  if(!btn) return;
  const icon=btn.querySelector('.theme-icon');
  function applyTheme(light, save=true){
    document.body.classList.toggle('light-mode',light);
    const darkEnabled=!light;
    btn.setAttribute('aria-pressed',String(darkEnabled));
    btn.setAttribute('aria-label',darkEnabled?'Sötét mód bekapcsolva':'Sötét mód kikapcsolva');
    btn.title=darkEnabled?'Sötét mód bekapcsolva':'Sötét mód kikapcsolva';
    if(icon) icon.textContent='☾';
    if(save){
      try{localStorage.setItem('futar-theme', light ? 'light' : 'dark');}catch(e){}
    }
    window.dispatchEvent(new Event('resize'));
  }
  let savedTheme=null;
  try{savedTheme=localStorage.getItem('futar-theme');}catch(e){}
  applyTheme(savedTheme==='light', false);
  btn.addEventListener('click',()=>applyTheme(!document.body.classList.contains('light-mode'), true));
})();

// Archívumban végzett böngésző-újratöltés (F5 / Ctrl+R) esetén térjünk vissza a mai főoldalra.
// Az archívum normál megnyitása és a dátumválasztóval történő navigáció továbbra is működik.
(function(){
  const isArchivePage = window.location.pathname.includes('/data/history/');
  if (!isArchivePage) return;
  let isReload = false;
  try {
    const navigation = performance.getEntriesByType('navigation');
    if (navigation && navigation.length) {
      isReload = navigation[0].type === 'reload';
    } else if (performance.navigation) {
      isReload = performance.navigation.type === 1;
    }
  } catch (e) {}
  if (isReload) {
    window.location.replace('https://owm-a.github.io/hidegtarolas/');
  }
})();

// Napi archívum: naptárnézet, kizárólag elérhető napok választhatók.
(function(){
  const dateButton = document.getElementById('history-date-button');
  const dateLabel = document.getElementById('history-date-label');
  const popup = document.getElementById('history-calendar-popup');
  const monthLabel = document.getElementById('history-month-label');
  const grid = document.getElementById('history-calendar-grid');
  const prevButton = document.getElementById('history-month-prev');
  const nextButton = document.getElementById('history-month-next');
  const status = document.getElementById('history-load-status');
  if (!dateButton || !dateLabel || !popup || !monthLabel || !grid || !status) return;

  const inHistoryFolder = window.location.pathname.includes('/data/history/');
  const historyBase = inHistoryFolder ? './' : 'data/history/';

  // A fejlécben a dátum magyar formátumú (pl. 2026.10.14.),
  // az archív HTML fájlnévben pedig ISO formátumú (2026-10-14.html).
  // Az archív fájlnév legyen az elsődleges forrás, így a mai dátum
  // soha nem írhatja felül a megnyitott archív napot.
  const archivePath = window.location.pathname.split('/').pop() || '';
  const archiveMatch = archivePath.match(/[0-9]{4}-[0-9]{2}-[0-9]{2}(?=\.html$)/);
  const currentDateMatch = document.querySelector('.fejlec-bal .adat');
  const headerText = currentDateMatch ? currentDateMatch.textContent : '';
  const headerMatch = headerText.match(/[0-9]{4}[.\/-][0-9]{2}[.\/-][0-9]{2}/);
  const headerDate = headerMatch
    ? headerMatch[0].replace(/[.\/]/g, '-')
    : '';
  const currentDate = inHistoryFolder && archiveMatch
    ? archiveMatch[0]
    : headerDate;
  const weekdays = ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'];
  let availableDates = new Set();
  let selectedDate = '';
  let shownMonth = new Date();
  shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth(), 1);

  function getHomeUrl(){
    const path = window.location.pathname;
    const base = inHistoryFolder
      ? path.split('/data/history/')[0] + '/'
      : (path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1));
    return base;
  }
  function formatDate(date){
    const [y,m,d] = date.split('-').map(Number);
    return `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}.`;
  }
  function dateKey(year, month, day){
    return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  function closeCalendar(){
    popup.hidden = true;
    dateButton.setAttribute('aria-expanded','false');
  }
  function renderCalendar(){
    const year = shownMonth.getFullYear();
    const month = shownMonth.getMonth();
    monthLabel.textContent = new Intl.DateTimeFormat('hu-HU',{month:'long',year:'numeric'}).format(shownMonth);
    grid.replaceChildren();
    weekdays.forEach(day => {
      const el = document.createElement('div');
      el.className = 'history-calendar-weekday';
      el.textContent = day;
      el.setAttribute('role','columnheader');
      grid.appendChild(el);
    });
    const firstDay = new Date(year, month, 1);
    const offset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for(let i=0;i<offset;i++){
      const blank = document.createElement('span');
      blank.setAttribute('aria-hidden','true');
      grid.appendChild(blank);
    }
    for(let day=1; day<=daysInMonth; day++){
      const key = dateKey(year, month, day);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'history-calendar-day';
      button.textContent = String(day);
      button.setAttribute('role','gridcell');
      button.setAttribute('aria-label',formatDate(key));
      if(availableDates.has(key)){
        button.classList.add('available');
        button.disabled = false;
        if(key === selectedDate) button.classList.add('selected');
        button.addEventListener('click', () => chooseDate(key));
      } else {
        button.disabled = true;
        button.setAttribute('aria-disabled','true');
      }
      grid.appendChild(button);
    }
    if(prevButton) prevButton.disabled = availableDates.size === 0 || [...availableDates].every(d => d.slice(0,7) >= dateKey(year,month,1).slice(0,7));
    if(nextButton) nextButton.disabled = availableDates.size === 0 || [...availableDates].every(d => d.slice(0,7) <= dateKey(year,month,1).slice(0,7));
  }
  async function chooseDate(date){
    if(!availableDates.has(date)) return;
    selectedDate = date;
    dateLabel.textContent = formatDate(date);
    closeCalendar();
    status.textContent = '';
    const budapestiReszek = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const budapestiDatum = Object.fromEntries(budapestiReszek.map(p => [p.type, p.value]));
    const maiDatum = `${budapestiDatum.year}-${budapestiDatum.month}-${budapestiDatum.day}`;
    if(date === maiDatum){
      window.location.href = getHomeUrl();
      return;
    }
    dateButton.disabled = true;
    status.textContent = 'Archívum megnyitása…';
    try{
      const response = await fetch(historyBase + date + '.html', {method:'HEAD',cache:'no-store'});
      if(!response.ok) throw new Error('Ehhez a naphoz még nincs HTML-archívum.');
      window.location.href = historyBase + date + '.html';
    }catch(err){
      status.textContent = err.message || 'Az archívum nem tölthető be.';
      dateButton.disabled = false;
    }
  }

  dateButton.addEventListener('click', () => {
    const opening = popup.hidden;
    popup.hidden = !opening;
    dateButton.setAttribute('aria-expanded',String(opening));
    if(opening) renderCalendar();
  });
  if(prevButton) prevButton.addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);renderCalendar();});
  if(nextButton) nextButton.addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);renderCalendar();});
  document.addEventListener('click',e=>{if(!e.target.closest('#history-calendar')) closeCalendar();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closeCalendar();});

  fetch(historyBase + 'index.json',{cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('Az archívumlista nem érhető el.');return r.json();})
    .then(data=>{
      const archiveDates = Array.isArray(data.dates) ? [...new Set(data.dates.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort() : [];
      const budapestiReszek = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const budapestiDatum = Object.fromEntries(budapestiReszek.map(p => [p.type, p.value]));
      const maiDatum = `${budapestiDatum.year}-${budapestiDatum.month}-${budapestiDatum.day}`;
      const dates = [...new Set([...archiveDates, maiDatum])].sort();
      availableDates = new Set(dates);
      selectedDate = dates.includes(currentDate) ? currentDate : (dates.includes(maiDatum) ? maiDatum : dates[dates.length-1]);
      dateLabel.textContent = formatDate(selectedDate);
      const [year,month] = selectedDate.split('-').map(Number);
      shownMonth = new Date(year,month-1,1);
      dateButton.disabled = false;
      if(!archiveDates.length) status.textContent = 'Csak a mai nap érhető el; régebbi napokhoz archívum szükséges.';
      renderCalendar();
    })
    .catch(()=>{
      dateLabel.textContent = 'Archívum nem érhető el';
      dateButton.disabled = true;
      status.textContent = 'Az archívumlista nem érhető el.';
    });
})();

// A főcímre kattintva is mindig a kanonikus, aktuális napi főoldal nyílik meg.
(function(){
  const cim=document.getElementById('oldal-cim');
  if(!cim) return;
  const maiNap=()=>{ window.location.href='https://owm-a.github.io/hidegtarolas/'; };
  cim.addEventListener('click',maiNap);
  cim.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      maiNap();
    }
  });
})();

// Automatikus oldalfrissítés 5 percenként, kapcsolható gombbal.
(function(){
  const button = document.getElementById('auto-refresh-toggle');
  if (!button) return;
  // Új oldalbetöltéskor mindig bekapcsolt állapotból indul.
  // A gomb az aktuális munkamenetben kikapcsolható, de ezt nem mentjük el.
  let enabled = true;

  function render(){
    button.setAttribute('aria-pressed', enabled ? 'true' : 'false');
    button.title = enabled ? 'Automatikus frissítés bekapcsolva' : 'Automatikus frissítés kikapcsolva';
  }
  render();
  button.addEventListener('click', function(){
    enabled = !enabled;
    render();
  });
  window.setInterval(function(){
    if (enabled) window.location.reload();
  }, 5 * 60 * 1000);
})();
</script>

const map = L.map(

// OSM Standard, a sötét/világos megjelenítést a dashboard CSS kapcsolja.

const terkepElemek = [];
const jarmuMarkerek = {};
const TERKEP_MAX_ZOOM = 19;


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")

}


function jarmuIkon(statusz) {

    else if (statusz === "NEM") {

}

});


// ---------------------------------------------------------
// JÁRMŰVEK

terkepJarmuvek.forEach(function(jarmu) {

    const marker = L.marker(

        {

        }

    marker.__forras = String(jarmu.forras || "biztor").trim() || "biztor";

    if (jarmu.statusz === "OK") {
        statuszSzoveg =

// Kattintáskor a térképhez görgetünk, majd a megadott koordinátára fókuszálunk.
function ugrasTerkephez(koordinata, marker, kesleltetes=220) {
    const terkepDoboz = document.getElementById("geozona-terkep");
    if (terkepDoboz) terkepDoboz.scrollIntoView({behavior: "smooth", block: "start"});
    setTimeout(function() {
        map.invalidateSize();
        map.flyTo(koordinata, TERKEP_MAX_ZOOM, {duration: 0.7});
        setTimeout(function() { if (marker) marker.openPopup(); }, 740);
    }, kesleltetes);
}

// A Valós tárolás koordinátáihoz csak kattintáskor jelenik meg külön pin.
// Geozónanév nem kattintható; kizárólag a geozónán kívüli GPS-koordináta.
const tarolasMarkerek = [];
function tarolasiKoordinata(hely) {
    const szoveg = String(hely || "").trim();
    if (!szoveg || /^(n\.a|nincs adat|pótlás\/cserekocsi|-)$/i.test(szoveg)) return null;
    const zona = terkepZonak.find(function(z) {
        return String(z.nev || "").trim().toLocaleLowerCase("hu") === szoveg.toLocaleLowerCase("hu");
    });
    // A geozónák neveihez soha nem készítünk tárolási pint.
    if (zona) return null;
    const m = szoveg.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)/);
    if (m) {
        const lat = Number(m[1]), lon = Number(m[2]);
        if (Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return [lat, lon];
    }
    return null;
}

document.querySelectorAll("#fix-tbody-common tr[data-forras]").forEach(function(tr) {
    const storageCell = tr.querySelector("td.storage");
    if (!storageCell) return;
    const hely = storageCell.textContent.trim();
    const koordinata = tarolasiKoordinata(hely);
    if (!koordinata) return;

    storageCell.classList.add("storage-coordinate-clickable");
    storageCell.title = "Kattints a koordináta térképen való megjelenítéséhez";
    storageCell.setAttribute("role", "button");
    storageCell.setAttribute("tabindex", "0");

    const rendszam = tr.querySelector(".rendszam-link")?.dataset.rendszam || "";
    const viszonylat = tr.children[0]?.textContent.trim() || "";
    const forda = tr.children[1]?.textContent.trim() || "";
    const forras = String(tr.dataset.forras || "biztor").trim();
    let marker = null;

    function mutatTarolasiPint() {
        if (!marker) {
            marker = L.marker(koordinata);
            marker.__forras = forras;
            marker.bindPopup(
                "<b>Valós tárolás</b><br>"
                + "<b>Hely:</b> " + escapeHtml(hely) + "<br>"
                + "<b>Rendszám:</b> <u>" + escapeHtml(rendszam) + "</u><br>"
                + "<b>Viszonylat:</b> " + escapeHtml(viszonylat) + "<br>"
                + "<b>Forda:</b> " + escapeHtml(forda)
            );
        }
        if (!tarolasMarkerek.includes(marker)) tarolasMarkerek.push(marker);
        if (!map.hasLayer(marker)) marker.addTo(map);
        ugrasTerkephez(koordinata, marker);
    }

    storageCell.addEventListener("click", mutatTarolasiPint);
    storageCell.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            mutatTarolasiPint();
        }
    });
});

// Az idővonal I/N/P cellái az adott percben elmentett GPS-pozícióra mutatnak.
// Egy időoszlop fejlécére kattintva az éppen látható sorok azonos időpontú lokációi egyszerre jelennek meg.
const tortenetiLokacioMarkerek = [];
let tortenetiOszlopAktiv = false;
function tortenetiOraPerc(ertek) {
    const match = String(ertek || "").trim().match(/(?:^|\D)(\d{1,2}):(\d{2})(?:\D|$)/);
    if (!match) return null;
    const ora = Number(match[1]);
    const perc = Number(match[2]);
    if (ora > 23 || perc > 59) return null;
    return ora * 60 + perc;
}

// A történeti lokáció időbeli színe és láthatósága ugyanazt a szabályt követi:
// szolgálat előtt 15 percig és utána 15 percig szürke, a szolgálat ideje alatt
// I=zöld, N=piros, P=kék, végleges döntés nélkül pedig szürke.
function tortenetiLokacioAllapot(cell) {
    const sor = cell.closest("tr");
    const kezdesSzoveg = sor?.querySelector(".kezdés")?.textContent || "";
    const vegzesSzoveg = sor?.querySelector(".végzés")?.textContent || "";
    const idoSzoveg = cell.dataset.idopont
        || document.querySelector('.idopont-ertek[data-time-index="' + cell.dataset.timeIndex + '"]')?.textContent
        || "";
    let kezdes = tortenetiOraPerc(kezdesSzoveg);
    let vegzes = tortenetiOraPerc(vegzesSzoveg);
    let ido = tortenetiOraPerc(idoSzoveg);

    const nyersStatusz = String(cell.dataset.statusz || "").trim().toUpperCase();
    const statuszbolJarmu = nyersStatusz === "I" ? "OK"
        : nyersStatusz === "N" ? "NEM"
        : nyersStatusz === "P" ? "PÓTLÁS" : "";

    // Ha a sorban nincs használható időadat, a korábbi státuszkezelés marad érvényben.
    if (kezdes === null || vegzes === null || ido === null) {
        return {jarmuStatusz: statuszbolJarmu, megjelenit: true, szolgIdonBelul: true};
    }

    // Éjfélen átnyúló szolgálatok kezelése.
    if (vegzes < kezdes) {
        vegzes += 1440;
        if (ido < kezdes) ido += 1440;
    }

    const szolgIdonBelul = ido >= kezdes && ido <= vegzes;
    const beleferElotte = ido >= kezdes - 15 && ido < kezdes;
    const beleferUtana = ido > vegzes && ido <= vegzes + 15;

    if (!szolgIdonBelul && !beleferElotte && !beleferUtana) {
        return {jarmuStatusz: "", megjelenit: false, szolgIdonBelul: false};
    }

    if (!szolgIdonBelul) {
        return {jarmuStatusz: "", megjelenit: true, szolgIdonBelul: false};
    }

    return {
        jarmuStatusz: statuszbolJarmu,
        megjelenit: true,
        szolgIdonBelul: true
    };
}

function tortenetiMarkerLetrehozasa(cell) {
    const idoAllapot = tortenetiLokacioAllapot(cell);
    if (!idoAllapot.megjelenit) return null;
    if (cell.__tortenetiMarker) return cell.__tortenetiMarker;

    const koordinata = [Number(cell.dataset.lat), Number(cell.dataset.lon)];
    if (!Number.isFinite(koordinata[0]) || !Number.isFinite(koordinata[1])) return null;

    const jarmuStatusz = idoAllapot.jarmuStatusz;
    const marker = L.marker(koordinata, {icon: jarmuIkon(jarmuStatusz)});
    marker.__forras = String(cell.closest("tr")?.dataset.forras || "biztor").trim();
    marker.__tortenetiStatusz = jarmuStatusz;

    let statuszSzoveg = "";
    if (jarmuStatusz === "OK") statuszSzoveg = '<span style="color:#00a040;font-weight:bold;">OK</span>';
    else if (jarmuStatusz === "NEM") statuszSzoveg = '<span style="color:#e00000;font-weight:bold;">ELTÉRÉS</span>';
    else if (jarmuStatusz === "PÓTLÁS") statuszSzoveg = '<span style="color:#4da3ff;font-weight:bold;">pótlás/cserekocsi</span>';

    const gpsIdo = cell.dataset.gpsIdo || "nem ismert";
    const rendszam = cell.dataset.rendszam || "n.a";
    const viszonylat = cell.dataset.viszonylat || "";
    const forda = cell.dataset.forda || "";
    const helyszin = cell.dataset.helyszin || "n.a";
    const jarmuAdatHtml =
        "<b><u>" + escapeHtml(rendszam) + "</u></b><br>"
        + "<b>Viszonylat:</b> " + escapeHtml(viszonylat) + "<br>"
        + "<b>Forda:</b> " + escapeHtml(forda) + "<br>"
        + "<b>Geozóna:</b> " + escapeHtml(helyszin) + "<br>"
        + (statuszSzoveg ? "<b>Állapot:</b> " + statuszSzoveg + "<br>" : "")
        + "<b>Utolsó friss GPS-pozíció:</b> " + escapeHtml(gpsIdo) + "<br>"
        + "<b>GPS:</b> " + escapeHtml(koordinata[0].toFixed(6) + ", " + koordinata[1].toFixed(6));

    // Ugyanaz a jármű-pin, tooltip/popup viselkedés és információs szerkezet, mint az aktuális pozícióknál.
    const egeresEszkoz = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (egeresEszkoz) {
        marker.bindTooltip(jarmuAdatHtml, {direction:"top", sticky:true, opacity:0.97, className:"jarmu-hover-adatok"});
    } else {
        marker.bindPopup(jarmuAdatHtml);
    }
    cell.__tortenetiMarker = marker;
    return marker;
}

// A történeti GPS-pontok közelség szerint csoportosulnak. A klaszter színenként
// mutatja a darabszámot (I/zöld, N/piros, P/kék); a pontokat nem terítjük szét.
// Kattintáskor nagyítunk, így a helyek fokozatosan válnak külön láthatóvá.
const tortenetiCsoportMarkerek = [];
function tortenetiStatuszSzin(statusz) {
    if (statusz === "OK") return "#198754";
    if (statusz === "NEM") return "#dc3545";
    if (statusz === "PÓTLÁS") return "#0d6efd";
    return "#687384";
}
function aktualisTerkepNezet() {
    try {
        const v = localStorage.getItem("hidegtarolas-aktiv-nezet");
        return ["mindketto", "biztor", "garazs", "none"].includes(v) ? v : "biztor";
    } catch (e) { return "biztor"; }
}
function markerAktivNezetben(marker) {
    const nezet = aktualisTerkepNezet();
    return nezet !== "none" && (nezet === "mindketto" || marker.__forras === nezet);
}
function frissitTortenetiCsoportokat() {
    tortenetiCsoportMarkerek.forEach(function(m) { if (map.hasLayer(m)) map.removeLayer(m); });
    tortenetiCsoportMarkerek.length = 0;
    const osszesTorteneti = tortenetiLokacioMarkerek.filter(function(m) { return !!m; });
    const tortenetiak = osszesTorteneti.filter(markerAktivNezetben);
    // Az aktuális nézetbe nem tartozó pontokat se egyedileg, se klaszterben ne mutassuk.
    osszesTorteneti.forEach(function(m) {
        if (!markerAktivNezetben(m)) { if (map.hasLayer(m)) map.removeLayer(m); }
        else if (!map.hasLayer(m)) m.addTo(map);
    });
    // 15-ös zoom fölött minden pozíció külön jelölőként látszik, nincs klaszterezés.
    if (map.getZoom() > 15 || tortenetiak.length < 2) return;

    // Közös képernyőrács: egy klaszterbe kerülhet több állapot, de mindegyik
    // saját színű számlálót kap. A rács zoommal kisebbedik, az azonos koordináták
    // pedig külön nagyításkor sem vesznek el.
    const racsMeret = map.getZoom() > 15 ? 20 : map.getZoom() > 12 ? 30 : 48;
    const csoportok = new Map();
    tortenetiak.forEach(function(m) {
        const pont = map.latLngToLayerPoint(m.getLatLng());
        const kulcs = Math.floor(pont.x / racsMeret) + ":" + Math.floor(pont.y / racsMeret);
        if (!csoportok.has(kulcs)) csoportok.set(kulcs, {pontok: []});
        csoportok.get(kulcs).pontok.push(m);
    });

    const klaszterezettPontok = new Set();
    csoportok.forEach(function(csoport) {
        if (csoport.pontok.length < 2) return;
        csoport.pontok.forEach(function(m) { klaszterezettPontok.add(m); });
        const latlngs = csoport.pontok.map(function(m) { return m.getLatLng(); });
        const kozep = L.latLng(
            latlngs.reduce((a, ll) => a + ll.lat, 0) / latlngs.length,
            latlngs.reduce((a, ll) => a + ll.lng, 0) / latlngs.length
        );
        const darabok = new Map();
        csoport.pontok.forEach(function(m) {
            const statusz = m.__tortenetiStatusz || "EGYEB";
            darabok.set(statusz, (darabok.get(statusz) || 0) + 1);
        });
        const sorrend = ["OK", "NEM", "PÓTLÁS", "EGYEB"];
        const elemek = sorrend.filter(function(statusz) { return darabok.has(statusz); });
        const szoveg = elemek.map(function(statusz) {
            const szin = tortenetiStatuszSzin(statusz);
            const szam = darabok.get(statusz);
            return '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:16px;padding:2px 3px;border-radius:8px;background:' + szin + ';color:#fff;font-weight:800;font-size:11px;line-height:15px;">' + szam + '</span>';
        }).join('<span style="color:#374151;font-weight:800;padding:0 1px;">/</span>');
        // Dinamikus szélesség: csak a szükséges helyet foglalja, 1/2/3 állapotnál is.
        const szelesseg = Math.max(30, Math.min(92, elemek.length * 25 + Math.max(0, elemek.length - 1) * 5));
        const ikon = L.divIcon({
            className: "",
            iconSize: [szelesseg, 27],
            iconAnchor: [szelesseg / 2, 13],
            html: '<div style="display:flex;align-items:center;justify-content:center;gap:1px;min-height:25px;box-sizing:border-box;padding:2px 4px;border:1.5px solid #fff;border-radius:14px;background:#fff;box-shadow:0 1px 5px #0007;white-space:nowrap;">' + szoveg + '</div>'
        });
        const osszevono = L.marker(kozep, {
            icon: ikon,
            keyboard: true,
            title: elemek.map(function(statusz) {
                const cimke = statusz === "OK" ? "zöld/I" : statusz === "NEM" ? "piros/N" : statusz === "PÓTLÁS" ? "kék/P" : "egyéb";
                return darabok.get(statusz) + " " + cimke;
            }).join(", ")
        });
        osszevono.on("click", function() {
            if (map.getZoom() < TERKEP_MAX_ZOOM) {
                map.setView(kozep, Math.min(map.getZoom() + 2, TERKEP_MAX_ZOOM));
            } else {
                // Azonos koordináták maximális zoomnál sem fedik el a tartalmat:
                // a csoport popupja felsorolja a hozzá tartozó járműveket/státuszokat.
                const reszletek = csoport.pontok.map(function(m) {
                    const el = m.getPopup && m.getPopup();
                    const tartalom = el ? el.getContent() : "GPS-pozíció";
                    return '<div style="padding:4px 0;border-bottom:1px solid #ddd;">' + tartalom + '</div>';
                }).join("");
                L.popup({maxWidth:300,maxHeight:260}).setLatLng(kozep).setContent(reszletek).openOn(map);
            }
        });
        osszevono.addTo(map);
        tortenetiCsoportMarkerek.push(osszevono);
    });
    klaszterezettPontok.forEach(function(m) { if (map.hasLayer(m)) map.removeLayer(m); });
}
map.on("zoomend", frissitTortenetiCsoportokat);

document.querySelectorAll(".idopont-cella.lokacio-kattinthato[data-lat][data-lon]").forEach(function(cell) {
    function mutatTortenetiLokaciot() {
        const marker = tortenetiMarkerLetrehozasa(cell);
        if (!marker) return;
        const marEzAzEgyetlen = tortenetiLokacioMarkerek.length === 1 && tortenetiLokacioMarkerek[0] === marker && map.hasLayer(marker);
        (jarmuMarkerek["__lista__"] || []).forEach(function(m) { if (map.hasLayer(m)) map.removeLayer(m); });
        tarolasMarkerek.forEach(function(m) { if (map.hasLayer(m)) map.removeLayer(m); });
        tortenetiLokacioMarkerek.forEach(function(m) { if (map.hasLayer(m)) map.removeLayer(m); });
        tortenetiLokacioMarkerek.length = 0;
        tortenetiOszlopAktiv = true;
        if (marEzAzEgyetlen) {
            frissitLokacioSzam();
            return;
        }
        tortenetiLokacioMarkerek.push(marker);
        marker.addTo(map);
        ugrasTerkephez([Number(cell.dataset.lat), Number(cell.dataset.lon)], marker);
        frissitTortenetiCsoportokat();
    }
    cell.addEventListener("click", mutatTortenetiLokaciot);
    cell.setAttribute("role", "button");
    cell.setAttribute("tabindex", "0");
    cell.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            mutatTortenetiLokaciot();
        }
    });
});

// A kiválasztott rendszám vagy időpont megjelenítése a nézetfülek mellett.
let kijeloltTortenetiAdat = null;
function frissitKijeloltAdat(tipus, ertek) {
    kijeloltTortenetiAdat = (tipus && ertek !== null && ertek !== undefined && ertek !== "")
        ? {tipus: tipus, ertek: ertek} : null;
    document.querySelectorAll(".fo-kozos-tabla td.rendszam.kijelolt-rendszam").forEach(function(td) {
        td.classList.remove("kijelolt-rendszam");
    });
    if (kijeloltTortenetiAdat && tipus === "rendszam") {
        const keresett = String(ertek).trim().toUpperCase();
        document.querySelectorAll("#fix-tbody-common tr[data-forras]").forEach(function(tr) {
            const link = tr.querySelector(".rendszam-link");
            const td = link && link.closest("td.rendszam");
            if (td && String(link.dataset.rendszam || link.textContent).trim().toUpperCase() === keresett) {
                td.classList.add("kijelolt-rendszam");
            }
        });
    }
    const cel = document.getElementById("kijelolt-adat");
    if (!cel) return;
    if (!kijeloltTortenetiAdat) { cel.textContent = ""; return; }
    if (tipus === "jarmu-idopont") {
        const rendszam = String(ertek.rendszam || "n.a.");
        const idopont = String(ertek.idopont || "ismeretlen időpont");
        cel.innerHTML = "<span>Rendszám:</span><span class=\"kijelolt-ertek\">" + escapeHtml(rendszam) +
            "</span><span>Időpont:</span><span class=\"kijelolt-ertek\">" + escapeHtml(idopont) + "</span>";
        return;
    }
    const cimke = tipus === "rendszam" ? "Rendszám:" : "Időpont:";
    cel.innerHTML = "<span>" + cimke + "</span><span class=\"kijelolt-ertek\">" + escapeHtml(String(ertek)) + "</span>";
}

// Egy rendszám melletti apró előzménygomb az adott rendszám teljes napi GPS-történetét jeleníti meg.
document.querySelectorAll(".rendszam-napi-elozmeny[data-rendszam-elozmeny]").forEach(function(btn) {
    btn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        const rendszam = String(this.dataset.rendszamElozmeny || "").trim().toUpperCase();
        if (!rendszam) return;
        frissitKijeloltAdat("rendszam", rendszam);

        // A rendszám napi előzménye önálló történeti nézet: az időoszlop kijelölését és a korábbi
        // marker-készleteket levesszük, majd csak ehhez a rendszámhoz tartozó GPS-pontokat tesszük fel.
        tortenetiOszlopAktiv = true;
        document.querySelectorAll(".idopont-oszlop-kattinthato[data-time-index]").forEach(function(elem) {
            elem.classList.remove("aktiv-idopont");
        });
        (jarmuMarkerek["__lista__"] || []).forEach(function(marker) {
            if (map.hasLayer(marker)) map.removeLayer(marker);
        });
        tarolasMarkerek.forEach(function(marker) {
            if (map.hasLayer(marker)) map.removeLayer(marker);
        });
        tortenetiLokacioMarkerek.forEach(function(marker) {
            if (map.hasLayer(marker)) map.removeLayer(marker);
        });
        tortenetiLokacioMarkerek.length = 0;

        const pontok = [];
        const aktivNezet = aktualisTerkepNezet();
        document.querySelectorAll("#fix-tbody-common tr[data-forras]").forEach(function(tr) {
            if (aktivNezet !== "mindketto" && String(tr.dataset.forras || "biztor") !== aktivNezet) return;
            const cells = tr.querySelectorAll('.idopont-cella.lokacio-kattinthato[data-lat][data-lon][data-rendszam]');
            cells.forEach(function(cell) {
                if (String(cell.dataset.rendszam || "").trim().toUpperCase() !== rendszam) return;
                const marker = tortenetiMarkerLetrehozasa(cell);
                if (!marker) return;
                if (!tortenetiLokacioMarkerek.includes(marker)) tortenetiLokacioMarkerek.push(marker);
                if (!map.hasLayer(marker)) marker.addTo(map);
                pontok.push(marker);
            });
        });

        if (pontok.length) {
            const bounds = L.featureGroup(pontok).getBounds();
            if (bounds.isValid()) {
                if (bounds.getNorthEast().equals(bounds.getSouthWest())) {
                    map.setView(bounds.getCenter(), TERKEP_MAX_ZOOM);
                } else {
                    map.fitBounds(bounds.pad(0.08), {maxZoom: TERKEP_MAX_ZOOM});
                }
            }
        }
        frissitLokacioSzam();
        // A napi előzmény térképes nézete a teljes oldal tetejére vigyen vissza.
        window.scrollTo({top: 0, left: 0, behavior: "smooth"});
    });
});

function jelolAktivIdopont(header) {
    document.querySelectorAll(".idopont-oszlop-kattinthato[data-time-index]").forEach(function(elem) {
        elem.classList.toggle("aktiv-idopont", elem === header);
    });
}

function jelolLegutolsoIdopont() {
    const idopontFejlecek = document.querySelectorAll(".idopont-oszlop-kattinthato[data-time-index]");
    if (idopontFejlecek.length) jelolAktivIdopont(idopontFejlecek[idopontFejlecek.length - 1]);
}

document.querySelectorAll(".idopont-oszlop-kattinthato[data-time-index]").forEach(function(header) {
    function mutatOszlopLokacioit() {
        jelolAktivIdopont(header);
        frissitKijeloltAdat("idopont", String(header.textContent || "").trim());
        const timeIndex = String(header.dataset.timeIndex);
        window.__hidegtarolasAktivIdopontIndex = timeIndex;
        // Az időoszlop kiválasztásakor kizárólag az adott időpont lokációi maradnak a térképen.
        tortenetiOszlopAktiv = true;
        (jarmuMarkerek["__lista__"] || []).forEach(function(marker) {
            if (map.hasLayer(marker)) map.removeLayer(marker);
        });
        tarolasMarkerek.forEach(function(marker) {
            if (map.hasLayer(marker)) map.removeLayer(marker);
        });
        tortenetiLokacioMarkerek.forEach(function(marker) {
            if (map.hasLayer(marker)) map.removeLayer(marker);
        });
        tortenetiLokacioMarkerek.length = 0;

        const sorok = Array.from(document.querySelectorAll("#fix-tbody-common tr[data-forras]"))
            .filter(tr => tr.getClientRects().length > 0 && tr.dataset.filterMatch !== "0");
        const markerek = [];
        sorok.forEach(function(tr) {
            const cell = tr.querySelector('.idopont-cella[data-time-index="' + timeIndex + '"][data-lat][data-lon]');
            if (!cell) return;
            const marker = tortenetiMarkerLetrehozasa(cell);
            if (!marker) return;
            if (!tortenetiLokacioMarkerek.includes(marker)) tortenetiLokacioMarkerek.push(marker);
            if (!map.hasLayer(marker)) marker.addTo(map);
            markerek.push(marker);
        });

        if (markerek.length) {
            const bounds = L.featureGroup(markerek).getBounds();
            if (bounds.isValid()) map.fitBounds(bounds.pad(0.08), {maxZoom: TERKEP_MAX_ZOOM});
            // Egy időpont kiválasztásakor a jelölők mind ugyanúgy nyithatók meg, mint az aktuális járművek.
        }
        frissitTortenetiCsoportokat();
        frissitLokacioSzam();
    }
    header.addEventListener("click", mutatOszlopLokacioit);
    header.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            mutatOszlopLokacioit();
        }
    });
});

// I/N/P (és egyéb idővonal-) cellára kattintva a nézetfülek mellett
// egyszerre jelenjen meg a sorhoz tartozó rendszám és az oszlop időpontja.
// Ez a tájékoztató akkor is működik, ha az adott cellához nincs GPS-koordináta.
document.querySelectorAll(".idopont-cella[data-time-index]").forEach(function(cell) {
    cell.addEventListener("click", function() {
        const sor = cell.closest("tr");
        const rendszamLink = sor && sor.querySelector(".rendszam-link");
        const rendszam = String(
            cell.dataset.rendszam ||
            (rendszamLink && (rendszamLink.dataset.rendszam || rendszamLink.textContent)) ||
            "n.a."
        ).trim().toUpperCase();
        const fejlec = document.querySelector('.idopont-ertek[data-time-index="' + cell.dataset.timeIndex + '"]');
        const idopont = String(cell.dataset.idopont || (fejlec && fejlec.textContent) || "").trim();
        frissitKijeloltAdat("jarmu-idopont", {rendszam: rendszam, idopont: idopont});
    });
});

// Betöltéskor a legutolsó időpont legyen kékkel kiemelve.
jelolLegutolsoIdopont();

function frissitLokacioSzam() {
    const elem = document.getElementById('map-location-count');
    if (!elem) return;

    // A klaszter csak összevonja a PIN-eket, az eredeti jelölők ettől még
    // léteznek. Ezért nem a map.hasLayer() alapján számolunk.
    // Történeti időpont vizsgálatakor csak a történeti PIN-ek számítanak.
    const jelolok = tortenetiOszlopAktiv
        ? tortenetiLokacioMarkerek
        : (jarmuMarkerek["__lista__"] || []).concat(tarolasMarkerek);

    const latszoDarab = new Set(jelolok.filter(function(marker) {
        return marker && markerAktivNezetben(marker);
    })).size;

    elem.innerHTML = '<b>Lokációk száma:</b> ' + latszoDarab;
}

// A térképre kerülő vagy onnan eltávolított jelölők után automatikusan frissül a darabszám.
map.on('layeradd layerremove', frissitLokacioSzam);
frissitLokacioSzam();

function frissitTerkepNezet(view) {
    const lista = jarmuMarkerek["__lista__"] || [];
    const osszesMarker = lista.concat(tarolasMarkerek, tortenetiLokacioMarkerek);
    osszesMarker.forEach(function(marker){
        if (map.hasLayer(marker)) map.removeLayer(marker);
    });
    const forrasLista = tortenetiOszlopAktiv ? tortenetiLokacioMarkerek : osszesMarker;
    const latszo = forrasLista.filter(function(marker){
        return view !== "none" && (view === "mindketto" || marker.__forras === view);
    });
    latszo.forEach(function(marker){ marker.addTo(map); });
    if (latszo.length) {
        const bounds = L.featureGroup(latszo).getBounds();
        if (bounds.isValid()) map.fitBounds(bounds.pad(0.08), {maxZoom: TERKEP_MAX_ZOOM});
    }
    if (tortenetiOszlopAktiv) frissitTortenetiCsoportokat();
    frissitLokacioSzam();
}

const NEZET_STORAGE_KEY = 'hidegtarolas-aktiv-nezet';
const ERVENYES_NEZETEK = ['mindketto', 'biztor', 'garazs', 'none'];
function betoltottTerkepNezet(){
    try {
        const mentett = localStorage.getItem(NEZET_STORAGE_KEY);
        return ERVENYES_NEZETEK.includes(mentett) ? mentett : 'mindketto';
    } catch (e) {
        return 'mindketto';
    }
}

document.querySelectorAll(".nezet-gomb").forEach(function(btn){
    btn.addEventListener("click", function(){
        // A fő nézetkapcsoló kezelője már frissítette a nézetet és a localStorage-t.
        // Itt csak a térképet szinkronizáljuk, nem váltunk újra nézetet.
        let nezet = 'mindketto';
        try {
            const mentett = localStorage.getItem(NEZET_STORAGE_KEY);
            if (ERVENYES_NEZETEK.includes(mentett)) nezet = mentett;
        } catch (e) {}

        // Ha időoszlopot vizsgálunk, a nézetváltás után ugyanazt az időpontot
        // újra lekérjük, immár az új nézetben látható sorokból.
        const aktivIdo = window.__hidegtarolasAktivIdopontIndex;
        if (tortenetiOszlopAktiv && aktivIdo !== undefined && aktivIdo !== null) {
            const header = document.querySelector('.idopont-oszlop-kattinthato[data-time-index="' + aktivIdo + '"]');
            if (header) header.click();
        }
        frissitTerkepNezet(nezet);
    });
});

function fokuszJarmure(rendszam) {
    const kulcs = String(rendszam || "").trim().toUpperCase();
    const marker = jarmuMarkerek[kulcs];
    if (!marker) return;

    // Rendszámra kattintva önálló, aktuális pozíciós nézetet mutatunk:
    // minden korábbi időpontból származó PIN-t és gyűjtőmarkert eltávolítunk.
    tortenetiOszlopAktiv = false;
    tortenetiLokacioMarkerek.forEach(function(m) {
        if (m && map.hasLayer(m)) map.removeLayer(m);
    });
    tortenetiLokacioMarkerek.length = 0;
    tortenetiCsoportMarkerek.forEach(function(m) {
        if (m && map.hasLayer(m)) map.removeLayer(m);
    });
    tortenetiCsoportMarkerek.length = 0;

    // A többi aktuális jármű PIN-jét és a tárolási helyek jelölőit is levesszük,
    // hogy kizárólag a kiválasztott jármű legutolsó pozíciója maradjon a térképen.
    (jarmuMarkerek["__lista__"] || []).forEach(function(m) {
        if (m && m !== marker && map.hasLayer(m)) map.removeLayer(m);
    });
    tarolasMarkerek.forEach(function(m) {
        if (m && map.hasLayer(m)) map.removeLayer(m);
    });
    if (!map.hasLayer(marker)) marker.addTo(map);
    frissitLokacioSzam();

    const pos = marker.getLatLng();
    // A táblázatból kattintva a térkép a globális maximális zoomig nagyíthat.
    map.flyTo(pos, TERKEP_MAX_ZOOM, {duration: 0.7});
    setTimeout(function(){
        if (!map.hasLayer(marker)) marker.addTo(map);
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            marker.openTooltip();
        } else {
            marker.openPopup();
        }
        const el = marker.getElement();
        if (el) {
            el.classList.remove("map-focus");
            void el.offsetWidth;
            el.classList.add("map-focus");
        }
    }, 700);
}

document.querySelectorAll(".rendszam-link").forEach(function(btn){
    btn.addEventListener("click", function(){
        window.scrollTo({top: 0, behavior: "smooth"});
        fokuszJarmure(this.dataset.rendszam);
    });
});


// ---------------------------------------------------------
// TÉRKÉP NÉZET BEÁLLÍTÁSA
// ---------------------------------------------------------

// A térkép ugyanazt a nézetet állítja vissza, mint a táblázat.
frissitTerkepNezet(betoltottTerkepNezet());

// Betöltéskor ne csak az utolsó időpontot jelöljük ki vizuálisan:
// ugyanazt a valódi kattintási műveletet futtatjuk le, mint kézi kiválasztáskor,
// így a történeti PIN-ek és a gyűjtő/klaszter logika is azonnal aktiválódik.
// A következő képkockára halasztjuk, hogy a táblázat és a lapfül láthatósága
// már beálljon, mire az időoszlop a látható sorokból dolgozik.
requestAnimationFrame(function() {
    const idopontFejlecek = document.querySelectorAll('.idopont-oszlop-kattinthato[data-time-index]');
    if (!idopontFejlecek.length) return;
    const utolsoFejlec = idopontFejlecek[idopontFejlecek.length - 1];
    utolsoFejlec.click();
});

const garazsAblak = document.getElementById("garazs-idopont-ablak");
const garazsBelso = document.getElementById("garazs-idopont-belső");
const garazsCsuszka = document.getElementById("garazs-idopont-csuszka");
function frissitGarazsCsuszkat() {
    if (!garazsAblak || !garazsBelso || !garazsCsuszka) return;
    const w = window.innerWidth;
    let timeWidth;
    if (w <= 600) timeWidth = Math.max(360, Math.round(w * 0.88));
    else if (w <= 900) timeWidth = Math.max(480, Math.round(w * 0.70));
    else timeWidth = Math.min(1200, Math.max(560, Math.round(w * 0.62)));
    document.documentElement.style.setProperty("--time-window-width", timeWidth + "px");
    const maxScroll = Math.max(0, garazsBelso.scrollWidth - garazsAblak.clientWidth);
    garazsCsuszka.value = "1000";
    garazsCsuszka.oninput = function() { garazsAblak.scrollLeft = maxScroll * (Number(this.value) / 1000); };
    garazsAblak.scrollLeft = maxScroll;
}
window.addEventListener("resize", frissitGarazsCsuszkat);
window.addEventListener("load", frissitGarazsCsuszkat);

</script>



<script>
(function(){
  let lastTap=0;
  document.addEventListener('touchend',function(e){
    const now=Date.now();
    if(now-lastTap<300){
      e.preventDefault();
    }
    lastTap=now;
  },{passive:false});
})();
</script>
